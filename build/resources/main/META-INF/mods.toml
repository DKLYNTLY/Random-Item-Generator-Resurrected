# This is an example mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/toml-lang/toml
# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml" #mandatory
# A version range to match for said mod loader - for regular FML @Mod it will be the forge version
loaderVersion="[47,)" #mandatory This is typically bumped every Minecraft version by Forge. See our download page for lists of versions.
# The license for you mod. This is mandatory metadata and allows for easier comprehension of your redistributive properties.
# Review your options at https://choosealicense.com/. All rights reserved is the default copyright stance, and is thus the default here.
# Review your options at https://choosealicense.com/. All rights reserved is the default copyright stance, and is thus the default here.
license = """
This mod, "Random Item Generator Resurrected," is the proprietary property of DarklyStudios. All rights reserved.

You may:
- Use this mod for personal, non-commercial purposes.

You may not:
- Copy, modify, distribute, or create derivative works based on this mod.
- Upload this mod to any website or platform without explicit permission from the author.
- Use this mod for commercial purposes.

Any unauthorized use of this mod is strictly prohibited and may result in legal action.

For permissions, contact DKLYNTLY at DarklyStudios@outlook.com.
"""

# A URL to refer people to when problems occur with this mod
issueTrackerURL="https://discord.com/invite/vwmd55YYEW" #optional
# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory
# The modid of the mod
modId="random_item_generator_resurrected" #mandatory
# The version number of the mod - there's a few well known null variables useable here or just hardcode it
# 2.0.1 will be substituted from gradle.properties during resource processing
version="2.0.1" #mandatory
# A display name for the mod
displayName="Random Item Generator Resurrected" #mandatory
# A URL to query for updates for this mod. See the JSON update specification https://mcforge.readthedocs.io/en/latest/gettingstarted/autoupdate/
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional
# A URL for the "homepage" for this mod, displayed in the mod UI
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional
# A file name (in the root of the mod JAR) containing a logo for display
logoFile="rigmod_resurrected.png" #optional
# A text field displayed in the mod UI
credits="inspiration from mitat original creator of rigmod" #optional
# A text field displayed in the mod UI
authors="darklynightly" #optional
# The description text for the mod (multi line!) (#mandatory)
description='''
This mod adds "Random Item Generator" block. Every time you mine this block it will drop a random item. If you mine with a silk touch pickaxe it will drop itself. If you break with a fortune pickaxe it can drop multiple items at once.

check out my other projects: https://legacy.curseforge.com/members/darklynightly/projects
'''
# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.random_item_generator_resurrected]] #optional
# the modid of the dependency
modId="forge" #mandatory
# Does this dependency have to exist - if not, ordering below must be specified
mandatory=true #mandatory
# The version range of the dependency
versionRange="[47,)" #mandatory
# An ordering relationship for the dependency - BEFORE or AFTER required if the relationship is not mandatory
ordering="NONE"
# Side this dependency is applied on - BOTH, CLIENT or SERVER
side="BOTH"
# Here's another dependency
[[dependencies.random_item_generator_resurrected]]
modId="minecraft"
mandatory=true
# This version range declares a minimum of the current minecraft version up to but not including the next major version
versionRange="[1.20.1,1.21)"
ordering="NONE"
side="BOTH"
